name: Validate and build anniversary site

on:
  push:
    branches: [main, "motion/editorial-cinematic"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build React + Motion site
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate source media references
        run: python scripts/validate_site.py
      - name: Verify built assets
        run: |
          test -f dist/index.html
          test -d dist/assets/photos
          test -d dist/assets/videos/clips
          test -d dist/assets/videos/posters
      - name: Install Playwright test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/anniversary-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/anniversary-preview.log
          exit 1
      - name: Audit desktop, mobile and interactions
        run: node scripts/visual_audit.mjs
      - name: Upload visual preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-cinematic-visual-preview
          path: artifacts/
          if-no-files-found: warn
